name: Firmware Compile

on:
  push:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - '.github/workflows/firmware-compile.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - '.github/workflows/firmware-compile.yml'

jobs:
  simon-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Simon sequence tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            tests/simon_sequence_test.cpp \
            -o /tmp/simon-sequence-test

      - name: Run Simon sequence tests
        run: /tmp/simon-sequence-test

  simon-guided:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify default-OFF and direct-launch denial
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=0 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=0 \
            -DMIKEY_ENABLE_SIMON_GUIDED_PREVIEW=0 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities/ \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/simon_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/SimonActivity.cpp \
            -o /tmp/simon-guided-off
          /tmp/simon-guided-off

      - name: Verify independent Simon preview and PLAY regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=0 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=0 \
            -DMIKEY_ENABLE_SIMON_GUIDED_PREVIEW=1 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities/ \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/simon_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/SimonActivity.cpp \
            -o /tmp/simon-guided-only
          /tmp/simon-guided-only

      - name: Verify three-mode preview combination
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=1 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=1 \
            -DMIKEY_ENABLE_SIMON_GUIDED_PREVIEW=1 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities/ \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/simon_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/SimonActivity.cpp \
            -o /tmp/simon-guided-all
          /tmp/simon-guided-all

  dice-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Digital Dice session tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            tests/dice_session_test.cpp \
            -o /tmp/dice-session-test

      - name: Run Digital Dice session tests
        run: /tmp/dice-session-test

  binary-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Binary Lab value tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            tests/binary_value_test.cpp \
            -o /tmp/binary-value-test

      - name: Run Binary Lab value tests
        run: /tmp/binary-value-test

  binary-guided:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify guided modes fail closed by default
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=0 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/binary_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/BinaryActivity.cpp \
            -o /tmp/binary-guided-off
          /tmp/binary-guided-off

      - name: Verify guided preview, answer safety and PLAY regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=1 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/binary_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/BinaryActivity.cpp \
            -o /tmp/binary-guided-on
          /tmp/binary-guided-on

  logic-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Logic Lab truth-table tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            tests/logic_state_test.cpp \
            -o /tmp/logic-state-test

      - name: Run Logic Lab truth-table tests
        run: /tmp/logic-state-test

  logic-guided:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Logic guided default OFF with Binary default OFF
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=0 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=0 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/logic_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/LogicActivity.cpp \
            -o /tmp/logic-guided-off
          /tmp/logic-guided-off

      - name: Verify Logic guided preview independent of Binary
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=0 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=1 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/logic_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/LogicActivity.cpp \
            -o /tmp/logic-guided-only
          /tmp/logic-guided-only

      - name: Verify Binary and Logic preview together
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=1 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=1 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/logic_guided_session_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/LogicActivity.cpp \
            -o /tmp/logic-guided-both
          /tmp/logic-guided-both

  guided-display-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every guided frame against conservative round-screen bounds
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=1 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=1 \
            -DMIKEY_ENABLE_SIMON_GUIDED_PREVIEW=1 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tests/guided_round_layout_test.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/BinaryActivity.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/LogicActivity.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/SimonActivity.cpp \
            -o /tmp/guided-display-layout
          /tmp/guided-display-layout

  guided-terminal-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build terminal preview with both guided modes enabled
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=1 \
            -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=1 \
            -DMIKEY_ENABLE_SIMON_GUIDED_PREVIEW=1 \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tools/guided-lab-cli.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/BinaryActivity.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/LogicActivity.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/SimonActivity.cpp \
            -o /tmp/mikey-guided-preview

      - name: Smoke-test Binary and Logic LEARN and CHALLENGE navigation
        run: |
          printf '1\nh\n2\nh\n3\nh\n4\nh\n5\nh\n6\nh\nq\n' | /tmp/mikey-guided-preview > /tmp/guided-screens.txt
          grep -q 'BINARY LEARN' /tmp/guided-screens.txt
          grep -q 'BINARY QUIZ' /tmp/guided-screens.txt
          grep -q 'LOGIC LEARN' /tmp/guided-screens.txt
          grep -q 'LOGIC CHALLENGE' /tmp/guided-screens.txt
          grep -q 'SIMON LEARN' /tmp/guided-screens.txt
          grep -q 'SIMON CHALLENGE' /tmp/guided-screens.txt
          grep -q 'LEDs' /tmp/guided-screens.txt

      - name: Smoke-test wrong prediction displays retry instead of answer
        run: |
          printf '1\nd\np\nh\nq\n' | /tmp/mikey-guided-preview > /tmp/guided-retry.txt
          grep -q 'TRY AGAIN' /tmp/guided-retry.txt

      - name: Simulate Simon prediction retry and explanation in terminal
        run: |
          printf '5\np\nd\nd\np\np\np\nh\nq\n' | /tmp/mikey-guided-preview > /tmp/simon-guided-terminal.txt
          grep -q 'TRY AGAIN' /tmp/simon-guided-terminal.txt
          grep -q 'NEXT IS LIGHT 3' /tmp/simon-guided-terminal.txt
          grep -q 'ORDER IS STORED' /tmp/simon-guided-terminal.txt
          grep -q 'LEDs' /tmp/simon-guided-terminal.txt

      - name: Verify unflagged desktop build shows SOON
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/core \
            tools/guided-lab-cli.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/BinaryActivity.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/LogicActivity.cpp \
            firmware/mikey-tech-lab/MikeyTechLab/src/activities/SimonActivity.cpp \
            -o /tmp/mikey-guided-preview-off
          printf '1\n3\n5\nq\n' | /tmp/mikey-guided-preview-off > /tmp/guided-off.txt
          grep -q 'SOON' /tmp/guided-off.txt

  debug-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Debug Detective session tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            tests/debug_session_test.cpp \
            -o /tmp/debug-session-test

      - name: Run Debug Detective session tests
        run: /tmp/debug-session-test

  jackpot-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install pinned ESP32 core
        run: arduino-cli core install esp32:esp32@3.3.8

      - name: Install pinned libraries
        run: |
          arduino-cli lib install 'LovyanGFX@1.2.26'
          arduino-cli lib install 'Adafruit NeoPixel@1.15.1'

      - name: Compile Jackpot baseline
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/jackpot-baseline/JackpotBaseline

  mikey-tech-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install pinned ESP32 core
        run: arduino-cli core install esp32:esp32@3.3.8

      - name: Install pinned libraries
        run: |
          arduino-cli lib install 'LovyanGFX@1.2.26'
          arduino-cli lib install 'Adafruit NeoPixel@1.15.1'

      - name: Compile Mikey Tech Lab app shell
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/mikey-tech-lab/MikeyTechLab

  mikey-tech-lab-guided-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install pinned ESP32 core and libraries
        run: |
          arduino-cli core install esp32:esp32@3.3.8
          arduino-cli lib install 'LovyanGFX@1.2.26'
          arduino-cli lib install 'Adafruit NeoPixel@1.15.1'

      - name: Compile explicitly enabled acceptance candidate
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --build-property "compiler.cpp.extra_flags=-DMIKEY_ENABLE_BINARY_GUIDED_PREVIEW=1 -DMIKEY_ENABLE_LOGIC_GUIDED_PREVIEW=1 -DMIKEY_ENABLE_SIMON_GUIDED_PREVIEW=1" \
            firmware/mikey-tech-lab/MikeyTechLab

