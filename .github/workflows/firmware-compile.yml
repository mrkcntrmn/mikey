name: Firmware Compile

on:
  push:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - '.github/workflows/firmware-compile.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - '.github/workflows/firmware-compile.yml'

jobs:
  simon-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Simon sequence tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            tests/simon_sequence_test.cpp \
            -o /tmp/simon-sequence-test

      - name: Run Simon sequence tests
        run: /tmp/simon-sequence-test

  dice-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Digital Dice session tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/mikey-tech-lab/MikeyTechLab/src/activities \
            tests/dice_session_test.cpp \
            -o /tmp/dice-session-test

      - name: Run Digital Dice session tests
        run: /tmp/dice-session-test

  jackpot-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install pinned ESP32 core
        run: arduino-cli core install esp32:esp32@3.3.8

      - name: Install pinned libraries
        run: |
          arduino-cli lib install 'LovyanGFX@1.2.26'
          arduino-cli lib install 'Adafruit NeoPixel@1.15.1'

      - name: Compile Jackpot baseline
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/jackpot-baseline/JackpotBaseline

  mikey-tech-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install pinned ESP32 core
        run: arduino-cli core install esp32:esp32@3.3.8

      - name: Install pinned libraries
        run: |
          arduino-cli lib install 'LovyanGFX@1.2.26'
          arduino-cli lib install 'Adafruit NeoPixel@1.15.1'

      - name: Compile Mikey Tech Lab app shell
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/mikey-tech-lab/MikeyTechLab
